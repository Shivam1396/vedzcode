<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Smart Canteen</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Smart Canteen</a>
    <nav><a href="/menu.html">Menu</a><a href="/login.html">Login</a></nav>
  </header>

  <main class="container narrow">
    <h1>Create your account</h1>
    <form id="signupForm" class="card">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" minlength="2" maxlength="80"
             autocomplete="name" required>

      <label for="email">Campus email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password (at least 8 characters)</label>
      <input id="password" name="password" type="password"
             minlength="8" autocomplete="new-password" required>

      <button type="submit">Create account</button>
      <p id="message" role="status"></p>
    </form>
    <p>Already registered? <a href="/login.html">Log in</a>.</p>
  </main>
</body>
</html>
