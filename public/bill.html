<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt | MIT Canteen</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14313a;--page:#f2f5f4;--accent:#1f7a6b;--muted:#5b6b70;--border:#d5dddf}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,"Segoe UI",system-ui,sans-serif;background:var(--page);color:var(--ink)}
.wrap{max-width:560px;margin:32px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px}
h1{margin:0;color:var(--accent);font-size:1.4rem}
.small{color:var(--muted);font-size:.9rem}
.tok{font-size:2rem;font-weight:800;color:var(--accent);margin:12px 0}
table{width:100%;border-collapse:collapse;margin:16px 0}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--border)}
th:last-child,td:last-child{text-align:right}
.total{font-size:1.2rem;font-weight:800;text-align:right}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button,.btns a{padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:inherit;text-decoration:none}
.btns button{background:var(--accent);color:#fff;border-color:var(--accent)}
@media print{.btns{display:none}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="bill"><p class="small">Loading receipt…</p></div>
  <div class="btns">
    <button onclick="window.print()">Print / Save as PDF</button>
    <a href="/myorders.html">My orders</a>
  </div>
</div>
<script>
const T = localStorage.getItem('token');
if (!T) location.replace('/login.html');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = new URLSearchParams(location.search).get('id');
const box = document.getElementById('bill');

(async () => {
  if (!id) { box.innerHTML = '<p class="small">No order selected.</p>'; return; }
  try {
    const r = await fetch('/api/orders/' + encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + T } });
    if (r.status === 401) { localStorage.clear(); location.href = '/login.html'; return; }
    const o = await r.json();
    if (!r.ok) throw new Error(o.message || 'Could not load receipt');
    box.innerHTML = `
      <h1>MIT Canteen</h1>
      <div class="small">${esc(o.messName || '')}</div>
      <div class="tok">Token #${o.tokenNo}</div>
      <div class="small">Customer: ${esc(o.user && o.user.name || '')}</div>
      <div class="small">Date: ${new Date(o.createdAt).toLocaleString('en-IN')}</div>
      <div class="small">UPI ref: ${esc(o.txnRef || '')}</div>
      <div class="small">Status: ${esc(o.status)}</div>
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead>
        <tbody>${o.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.quantity}</td><td>₹${Number(i.price).toFixed(2)}</td><td>₹${(i.price * i.quantity).toFixed(2)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="total">Total: ₹${Number(o.total).toFixed(2)}</div>`;
  } catch (e) {
    box.innerHTML = '<p class="small">' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
